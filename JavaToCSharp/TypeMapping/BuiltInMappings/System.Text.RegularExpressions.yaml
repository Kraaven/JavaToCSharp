      - java_member: matches
        arg_count: 2
        kind: template
        expression: "Regex.IsMatch($2, $1)"
        confidence: medium
        notes: "Java Pattern.matches is static and fully anchored; C# IsMatch is not anchored by default."
      - java_member: matches
        arg_count: 1
        kind: template
        expression: "$0.IsMatch($1)"
        notes: "Instance method: pattern.matcher(input).matches() → Regex.IsMatch(input, pattern) or regex.IsMatch(input)."
      - java_member: pattern
        arg_count: 0
        kind: property
        csharp_member: Pattern
        confidence: medium
        notes: "Java Pattern.pattern() returns the regex string; C# Regex.Pattern may not be available in all versions."
        returns_type: java.lang.String
      - java_member: matcher
        arg_count: 1
        kind: template
        expression: "$0.Match($1)"
        returns_type: java.util.regex.Matcher
      - java_member: split
        arg_count: 1
        kind: template
        expression: "Regex.Split($1, $0.ToString())"
        confidence: medium
        notes: "Java pattern.split(input) uses the pattern to split; C# Regex.Split uses separate args."
      - java_member: split
        arg_count: 2
        kind: template
        expression: "Regex.Split($1, $0.ToString(), $2)"
        confidence: medium
      - java_member: asPredicate
        arg_count: 0
        kind: template
        expression: "new Func<string, bool>(s => $0.IsMatch(s))"
        confidence: medium
        notes: "Java asPredicate returns a Predicate<String>; C# equivalent uses Func."
      - java_member: flags
        arg_count: 0
        kind: unsupported
        notes: "C# Regex does not expose flags as an integer."
      - java_member: quote
        arg_count: 1
        kind: template

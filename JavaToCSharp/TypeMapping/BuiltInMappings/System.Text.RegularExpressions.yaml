    kind: class
    entries:
      - java_member: compile
        arg_count: 1
        kind: template
        expression: "new Regex($1)"
        returns_type: java.util.regex.Pattern
      - java_member: compile
        arg_count: 2
        kind: template
        expression: "new Regex($1, (RegexOptions)$2)"
        confidence: medium
        notes: "Java Pattern.compile(regex, flags) uses int flags; C# uses RegexOptions enum."

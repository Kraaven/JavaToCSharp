  # java.text.MessageFormat
  # ============================================================
  - java_class: java.text.MessageFormat
    csharp_class: MessageFormat
    kind: class
    entries:
      - java_member: format
        arg_count: variadic
        kind: template
        expression: "string.Format($rest)"
        confidence: medium
        notes: "Java MessageFormat uses {0}, {1} placeholders; C# string.Format uses {0}, {1} — same syntax."
        returns_type: java.lang.String
      - java_member: format
        arg_count: 2
        kind: template
        expression: "string.Format($1, $2)"
        confidence: medium
        notes: "Java MessageFormat.format(pattern, args) maps to string.Format."
        returns_type: java.lang.String

namespaces:
  - java_packages: [java.text]
    csharp_packages: [System]

class_map:
  # ============================================================
  # java.lang.StringBuilder
  # ============================================================
  - java_class: java.lang.StringBuilder
    csharp_class: StringBuilder
    kind: class
    entries:
      - java_member: <init>
        member_type: constructor
        arg_count: 0
        kind: rename
        csharp_member: StringBuilder
      - java_member: <init>
        member_type: constructor
        arg_count: 1
        kind: rename
        csharp_member: StringBuilder
      - java_member: append
        arg_count: variadic
        kind: rename
        csharp_member: Append
        returns_type: java.lang.StringBuilder
      - java_member: appendCodePoint
        arg_count: 1
        kind: template
        expression: "$0.Append(char.ConvertFromUtf32($1))"
        confidence: medium
        notes: "Java appendCodePoint accepts a Unicode code point; C# Append expects a char or string."
        returns_type: java.lang.StringBuilder
      - java_member: insert
        arg_count: 2
        kind: rename
        csharp_member: Insert
        returns_type: java.lang.StringBuilder
      - java_member: delete
        arg_count: 2
        kind: template
        expression: "$0.Remove($1, $2 - $1)"
        notes: "Java's delete(start, end) becomes Remove(start, length)."
        returns_type: java.lang.StringBuilder
      - java_member: deleteCharAt
        arg_count: 1
        kind: template
        expression: "$0.Remove($1, 1)"
        notes: "C# StringBuilder.Remove requires (startIndex, count)."
        returns_type: java.lang.StringBuilder
      - java_member: replace
        arg_count: 3
        kind: template
        expression: "$0.Remove($1, $2 - $1).Insert($1, $3)"
        confidence: medium
        notes: "Java replace(start, end, str) replaces a range: remove the range, then insert the replacement at start."
        returns_type: java.lang.StringBuilder
      - java_member: reverse
        arg_count: 0
        kind: template
        expression: "$0.Append(string.Concat($0.ToString().Reverse()))"
        confidence: low
        notes: "Reverses in place by appending the reversed string; requires System.Linq. The original content is replaced."
        returns_type: java.lang.StringBuilder
      - java_member: substring
        arg_count: 1
        kind: template
        expression: "$0.ToString($1, $0.Length - $1)"
        confidence: medium
        notes: "Java substring(beginIndex) returns String; C# returns a substring of StringBuilder."
        returns_type: java.lang.String
      - java_member: substring
        arg_count: 2
        kind: template
        expression: "$0.ToString($1, $2 - $1)"
        notes: "Java's substring(beginIndex, endIndex) becomes ToString(index, length)."
        returns_type: java.lang.String
      - java_member: indexOf
        arg_count: 1
        kind: template
        expression: "$0.ToString().IndexOf($1)"
      - java_member: indexOf
        arg_count: 2
        kind: template
        expression: "$0.ToString().IndexOf($1, $2)"
      - java_member: lastIndexOf
        arg_count: 1
        kind: template
        expression: "$0.ToString().LastIndexOf($1)"
      - java_member: lastIndexOf
        arg_count: 2
        kind: template
        expression: "$0.ToString().LastIndexOf($1, $2)"
      - java_member: length
        arg_count: 0
        kind: property
        csharp_member: Length
      - java_member: charAt
        arg_count: 1
        kind: template
        expression: "$0[$1]"
      - java_member: capacity
        arg_count: 0
        kind: property
        csharp_member: Capacity
      - java_member: ensureCapacity
        arg_count: 1
        kind: template
        expression: "$0.EnsureCapacity($1)"
        confidence: high
        notes: "C# StringBuilder has an EnsureCapacity method (NET Core 3.0+)."
      - java_member: trimToSize
        arg_count: 0
        kind: template
        expression: "$0.Capacity = $0.Length"
        confidence: medium
        notes: "Java trims capacity to length; C# assigns Capacity directly."
      - java_member: setLength
        arg_count: 1
        kind: template
        expression: "$0.Length = $1"
        confidence: medium
        notes: "Java setLength pads with null chars if new length > current length; C# truncates."
      - java_member: toString
        arg_count: 0
        kind: rename
        csharp_member: ToString
        returns_type: java.lang.String
      - java_member: isEmpty
        arg_count: 0
        kind: template
        expression: "$0.Length == 0"
      - java_member: compareTo
        arg_count: 1
        kind: template
        expression: "string.Compare($0.ToString(), $1.ToString())"


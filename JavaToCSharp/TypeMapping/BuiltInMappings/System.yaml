# Built-in mapping spec: java.lang core types -> System
#
# Uses templates (not renames) for the boxing types so output uses the bare C#
# keywords (int.Parse, long.MaxValue) rather than @-escaped identifiers.
namespaces:
  - java_packages: [java.lang]
    csharp_packages: [System]

class_map:

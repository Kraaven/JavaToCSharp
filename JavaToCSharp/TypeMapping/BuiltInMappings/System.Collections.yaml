# Built-in mapping spec: java.util collections -> System.Collections
#
# Class-level renames map Java collection interfaces/classes to their C# generic
# counterparts. Member entries on the interfaces let member calls resolve on
# interface-typed variables (e.g. List<T> l; l.add(...)); the concrete classes
# add their own members as well.
namespaces:
  - java_packages: [java.util]
    csharp_packages: [System.Collections.Generic]

class_map:
  - java_class: java.util.List
    csharp_class: IList
    generic: true
    kind: interface
    entries:
      - java_member: size
        arg_count: 0
        kind: property
        csharp_member: Count
      - java_member: isEmpty
        arg_count: 0
        kind: template
        expression: "$0.Count == 0"
      - java_member: add
        arg_count: 1
        kind: rename
        csharp_member: Add
      - java_member: add
        arg_count: 2
        kind: rename
        csharp_member: Insert
        notes: "Java add(index, element) becomes Insert(index, element)."
      - java_member: get
        arg_count: 1
        kind: template
        expression: "$0[$1]"
      - java_member: set
        arg_count: 2
        kind: template
        expression: "$0[$1] = $2"
